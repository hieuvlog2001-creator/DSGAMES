name: Build DSGames IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -project DSGames/DSGames.xcodeproj -scheme DSGames -configuration Release -sdk iphoneos -archivePath "$PWD/build/DSGames.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive 2>&1 | tee build-xcodebuild.log
      - name: Show compiler errors
        if: failure()
        run: |
          echo '--- errors ---'
          grep -E 'error:|fatal error:|SwiftCompile|CompileSwift|Ld |CodeSign' build-xcodebuild.log | tail -n 200 || true
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSGames.xcarchive/Products/Applications/DSGames.app build/Payload/DSGames.app
          cd build
          zip -qry DSGames-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSGames-unsigned
          path: build/DSGames-unsigned.ipa
          if-no-files-found: error
